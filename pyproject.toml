[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-audience-toggle"
version = "0.1.0"
description = "Material for MkDocs plugin: an N-way content-mode toggle (e.g. Essentials/Advanced) that shows or hides marked content per mode."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Luka Sherman", email = "luka.msherman@gmail.com" }]
dependencies = ["mkdocs>=1.5"]
classifiers = [
  "Framework :: MkDocs",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
# Test-only. The plugin doesn't need mkdocs-material, but the test site uses it.
test = [
  "mkdocs-material",
  "pytest",
  "playwright",
  "pytest-playwright",
]

[project.urls]
Homepage = "https://github.com/lukasherman/mkdocs-audience-toggle"

[project.entry-points."mkdocs.plugins"]
audience_toggle = "mkdocs_audience_toggle.plugin:AudienceTogglePlugin"

[tool.hatch.build.targets.wheel]
packages = ["mkdocs_audience_toggle"]

[tool.hatch.build.targets.wheel.force-include]
"mkdocs_audience_toggle/static" = "mkdocs_audience_toggle/static"
